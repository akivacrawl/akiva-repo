<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hebrew Letter Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
  <style>
    .hebrew-biblical {
      font-family: 'Frank Ruhl Libre', 'David', 'Times New Roman', serif;
      font-weight: 900;
    }
    :root {
      --blue: #4a90d9;
      --green: #27ae60;
      --red: #e74c3c;
      --orange: #f39c12;
      --purple: #8e44ad;
      --teal: #1abc9c;
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: white;
      text-align: center;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 4px;
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .score-bar {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 12px;
      background: rgba(255,255,255,0.1);
      margin-top: 12px;
      border-radius: 8px;
      font-size: 1.1rem;
    }

    .score-bar span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Navigation */
    .nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      flex-wrap: wrap;
    }

    .nav button {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      color: white;
      box-shadow: var(--shadow);
    }

    .nav button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .nav button:active {
      transform: translateY(0);
    }

    .nav button.active {
      outline: 3px solid var(--text);
      outline-offset: 2px;
    }

    .btn-flashcards { background: linear-gradient(135deg, var(--teal), #16a085); }
    .btn-quiz { background: linear-gradient(135deg, var(--orange), #e67e22); }
    .btn-matching { background: linear-gradient(135deg, var(--purple), #9b59b6); }

    /* Main content */
    .content {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .hidden { display: none !important; }

    /* ===== FLASHCARD MODE ===== */
    .flashcard-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flashcard-container {
      perspective: 1000px;
      width: 280px;
      height: 340px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
    }

    .flashcard-front {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .flashcard-front .letter {
      font-size: 8rem;
      line-height: 1;
      margin-bottom: 10px;
      font-family: 'Frank Ruhl Libre', 'David', 'Times New Roman', serif;
      font-weight: 900;
    }

    .flashcard-front .hint {
      font-size: 1rem;
      opacity: 0.7;
    }

    .flashcard-back {
      background: linear-gradient(135deg, var(--teal), var(--green));
      color: white;
      transform: rotateY(180deg);
    }

    .flashcard-back .name {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .flashcard-back .sound {
      font-size: 1.3rem;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .flashcard-back .letter-small {
      font-size: 4rem;
      margin-top: 10px;
      font-family: 'Frank Ruhl Libre', 'David', 'Times New Roman', serif;
      font-weight: 900;
    }

    .flashcard-controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .flashcard-controls button {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: var(--blue);
      transition: transform 0.1s;
    }

    .flashcard-controls button:hover { transform: scale(1.05); }
    .flashcard-controls button:active { transform: scale(0.98); }

    .card-counter {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 12px;
    }

    /* ===== QUIZ MODE ===== */
    .quiz-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .quiz-letter {
      font-size: 9rem;
      line-height: 1;
      font-family: 'Frank Ruhl Libre', 'David', 'Times New Roman', serif;
      font-weight: 900;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .quiz-prompt {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: #555;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .quiz-options button {
      padding: 16px;
      border: 3px solid #ddd;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      background: white;
      transition: all 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .quiz-options button:hover {
      border-color: var(--blue);
      background: #f0f7ff;
      transform: translateY(-2px);
    }

    .quiz-options button.correct {
      border-color: var(--green);
      background: #d4edda;
      animation: pop 0.3s ease;
    }

    .quiz-options button.wrong {
      border-color: var(--red);
      background: #f8d7da;
      animation: shake 0.4s ease;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .quiz-feedback {
      font-size: 1.5rem;
      font-weight: 700;
      min-height: 40px;
      margin-bottom: 12px;
    }

    .quiz-next {
      padding: 12px 32px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: var(--blue);
      transition: transform 0.1s;
    }

    .quiz-next:hover { transform: scale(1.05); }

    .quiz-score {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 16px;
    }

    /* ===== MATCHING MODE ===== */
    .matching-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .matching-info {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 16px;
    }

    .matching-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }

    .matching-grid .tile {
      aspect-ratio: 1;
      border: 3px solid #ddd;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
      background: white;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      user-select: none;
    }

    .tile.is-letter {
      font-size: 2.5rem;
      font-family: 'Frank Ruhl Libre', 'David', 'Times New Roman', serif;
      font-weight: 900;
    }

    .tile:hover:not(.matched):not(.selected) {
      border-color: var(--blue);
      transform: translateY(-2px);
    }

    .tile.selected {
      border-color: var(--orange);
      background: #fff8e1;
      transform: scale(1.05);
    }

    .tile.matched {
      border-color: var(--green);
      background: #d4edda;
      cursor: default;
      opacity: 0.7;
    }

    .tile.wrong-match {
      border-color: var(--red);
      background: #f8d7da;
      animation: shake 0.4s ease;
    }

    .matching-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .matching-controls button {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: var(--purple);
      transition: transform 0.1s;
    }

    .matching-controls button:hover { transform: scale(1.05); }

    .matching-result {
      font-size: 1.5rem;
      font-weight: 700;
      min-height: 40px;
      margin-bottom: 12px;
      color: var(--green);
    }

    /* Celebration overlay */
    .celebration {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .celebration-box {
      background: white;
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      animation: pop 0.4s ease;
    }

    .celebration-box .big-star {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    .celebration-box h2 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .celebration-box p {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 20px;
    }

    .celebration-box button {
      padding: 12px 32px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: var(--green);
    }

    /* Responsive */
    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .flashcard-container { width: 240px; height: 300px; }
      .flashcard-front .letter { font-size: 6rem; }
      .quiz-letter { font-size: 7rem; width: 160px; height: 160px; }
      .matching-grid { grid-template-columns: repeat(3, 1fr); }
      .tile.is-letter { font-size: 2rem; }
      .quiz-options button { font-size: 1rem; padding: 12px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Hebrew Letter Practice</h1>
  <p>Learn the Alef-Bet!</p>
  <div class="score-bar">
    <span id="total-score">Score: 0</span>
    <span id="streak-display">Streak: 0</span>
  </div>
</header>

<nav class="nav">
  <button class="btn-flashcards active" onclick="switchMode('flashcards')">Flashcards</button>
  <button class="btn-quiz" onclick="switchMode('quiz')">Quiz</button>
  <button class="btn-matching" onclick="switchMode('matching')">Matching</button>
</nav>

<main class="content">

  <!-- FLASHCARD MODE -->
  <section id="flashcards-mode" class="flashcard-area">
    <p class="card-counter" id="card-counter">Card 1 of 27</p>
    <div class="flashcard-container" onclick="flipCard()">
      <div class="flashcard" id="flashcard">
        <div class="flashcard-front">
          <div class="letter" id="fc-letter"></div>
          <div class="hint">Tap to flip</div>
        </div>
        <div class="flashcard-back">
          <div class="name" id="fc-name"></div>
          <div class="sound" id="fc-sound"></div>
          <div class="letter-small" id="fc-letter-back"></div>
        </div>
      </div>
    </div>
    <div class="flashcard-controls">
      <button onclick="prevCard()">Previous</button>
      <button onclick="nextCard()">Next</button>
    </div>
  </section>

  <!-- QUIZ MODE -->
  <section id="quiz-mode" class="quiz-area hidden">
    <p class="quiz-score" id="quiz-score">Correct: 0 / 0</p>
    <div class="quiz-letter" id="quiz-letter"></div>
    <p class="quiz-prompt">What is the name of this letter?</p>
    <div class="quiz-options" id="quiz-options"></div>
    <p class="quiz-feedback" id="quiz-feedback"></p>
    <button class="quiz-next hidden" id="quiz-next" onclick="nextQuiz()">Next Question</button>
  </section>

  <!-- MATCHING MODE -->
  <section id="matching-mode" class="matching-area hidden">
    <p class="matching-info" id="matching-info">Match each Hebrew letter to its name. Tap a letter, then tap its name.</p>
    <div class="matching-grid" id="matching-grid"></div>
    <p class="matching-result" id="matching-result"></p>
    <div class="matching-controls">
      <button onclick="startMatching()">New Game</button>
    </div>
  </section>

</main>

<!-- Celebration overlay (hidden by default) -->
<div class="celebration hidden" id="celebration">
  <div class="celebration-box">
    <div class="big-star" id="celeb-star"></div>
    <h2 id="celeb-title"></h2>
    <p id="celeb-text"></p>
    <button onclick="closeCelebration()">Keep Going!</button>
  </div>
</div>

<script>
// ===== LETTER DATA =====
const letters = [
  { letter: "\u05D0", name: "Alef", sound: "silent / glottal stop" },
  { letter: "\u05D1", name: "Bet", sound: "b / v" },
  { letter: "\u05D2", name: "Gimel", sound: "g" },
  { letter: "\u05D3", name: "Dalet", sound: "d" },
  { letter: "\u05D4", name: "He", sound: "h" },
  { letter: "\u05D5", name: "Vav", sound: "v / o / u" },
  { letter: "\u05D6", name: "Zayin", sound: "z" },
  { letter: "\u05D7", name: "Chet", sound: "ch (guttural)" },
  { letter: "\u05D8", name: "Tet", sound: "t" },
  { letter: "\u05D9", name: "Yod", sound: "y" },
  { letter: "\u05DB", name: "Kaf", sound: "k / kh" },
  { letter: "\u05DC", name: "Lamed", sound: "l" },
  { letter: "\u05DE", name: "Mem", sound: "m" },
  { letter: "\u05E0", name: "Nun", sound: "n" },
  { letter: "\u05E1", name: "Samekh", sound: "s" },
  { letter: "\u05E2", name: "Ayin", sound: "silent / guttural" },
  { letter: "\u05E4", name: "Pe", sound: "p / f" },
  { letter: "\u05E6", name: "Tsadi", sound: "ts" },
  { letter: "\u05E7", name: "Qof", sound: "k" },
  { letter: "\u05E8", name: "Resh", sound: "r" },
  { letter: "\u05E9", name: "Shin", sound: "sh / s" },
  { letter: "\u05EA", name: "Tav", sound: "t" },
  // Final forms (sofit)
  { letter: "\u05DA", name: "Kaf Sofit", sound: "kh (final)" },
  { letter: "\u05DD", name: "Mem Sofit", sound: "m (final)" },
  { letter: "\u05DF", name: "Nun Sofit", sound: "n (final)" },
  { letter: "\u05E3", name: "Pe Sofit", sound: "f (final)" },
  { letter: "\u05E5", name: "Tsadi Sofit", sound: "ts (final)" },
];

let totalScore = 0;
let streak = 0;

function updateScore(points) {
  totalScore += points;
  document.getElementById("total-score").textContent = "Score: " + totalScore;
}

function updateStreak(correct) {
  if (correct) {
    streak++;
  } else {
    streak = 0;
  }
  document.getElementById("streak-display").textContent = "Streak: " + streak;
}

// ===== MODE SWITCHING =====
function switchMode(mode) {
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  document.querySelector(".btn-" + mode).classList.add("active");

  document.getElementById("flashcards-mode").classList.toggle("hidden", mode !== "flashcards");
  document.getElementById("quiz-mode").classList.toggle("hidden", mode !== "quiz");
  document.getElementById("matching-mode").classList.toggle("hidden", mode !== "matching");

  if (mode === "flashcards") initFlashcards();
  if (mode === "quiz") nextQuiz();
  if (mode === "matching") startMatching();
}

// ===== FLASHCARD MODE =====
let fcIndex = 0;

function initFlashcards() {
  fcIndex = 0;
  showFlashcard();
}

function showFlashcard() {
  const card = letters[fcIndex];
  document.getElementById("fc-letter").textContent = card.letter;
  document.getElementById("fc-name").textContent = card.name;
  document.getElementById("fc-sound").textContent = "Sound: " + card.sound;
  document.getElementById("fc-letter-back").textContent = card.letter;
  document.getElementById("card-counter").textContent =
    "Card " + (fcIndex + 1) + " of " + letters.length;

  // Reset flip
  document.getElementById("flashcard").classList.remove("flipped");
}

function flipCard() {
  document.getElementById("flashcard").classList.toggle("flipped");
}

function nextCard() {
  fcIndex = (fcIndex + 1) % letters.length;
  showFlashcard();
}

function prevCard() {
  fcIndex = (fcIndex - 1 + letters.length) % letters.length;
  showFlashcard();
}

// ===== QUIZ MODE =====
let quizCorrect = 0;
let quizTotal = 0;
let quizAnswered = false;

function nextQuiz() {
  quizAnswered = false;
  document.getElementById("quiz-feedback").textContent = "";
  document.getElementById("quiz-next").classList.add("hidden");

  // Pick a random letter
  const correctIdx = Math.floor(Math.random() * letters.length);
  const correct = letters[correctIdx];

  document.getElementById("quiz-letter").textContent = correct.letter;

  // Build 4 options: 1 correct + 3 wrong
  const wrongOptions = letters.filter((_, i) => i !== correctIdx);
  shuffle(wrongOptions);
  const options = [correct, wrongOptions[0], wrongOptions[1], wrongOptions[2]];
  shuffle(options);

  const container = document.getElementById("quiz-options");
  container.innerHTML = "";

  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.textContent = opt.name;
    btn.onclick = () => handleQuizAnswer(btn, opt.name === correct.name, correct.name);
    container.appendChild(btn);
  });
}

function handleQuizAnswer(btn, isCorrect, correctName) {
  if (quizAnswered) return;
  quizAnswered = true;
  quizTotal++;

  const feedback = document.getElementById("quiz-feedback");

  if (isCorrect) {
    quizCorrect++;
    btn.classList.add("correct");
    feedback.textContent = "Correct!";
    feedback.style.color = "var(--green)";
    updateScore(10);
    updateStreak(true);

    if (streak > 0 && streak % 5 === 0) {
      showCelebration(
        streak + " in a row!",
        "You're on fire! Keep going!"
      );
    }
  } else {
    btn.classList.add("wrong");
    // Highlight the correct answer
    document.querySelectorAll("#quiz-options button").forEach(b => {
      if (b.textContent === correctName) b.classList.add("correct");
    });
    feedback.textContent = "It's " + correctName;
    feedback.style.color = "var(--red)";
    updateStreak(false);
  }

  document.getElementById("quiz-score").textContent =
    "Correct: " + quizCorrect + " / " + quizTotal;
  document.getElementById("quiz-next").classList.remove("hidden");
}

// ===== MATCHING MODE =====
let matchSelected = null;
let matchedCount = 0;
let matchTotalPairs = 0;

function startMatching() {
  matchSelected = null;
  matchedCount = 0;
  document.getElementById("matching-result").textContent = "";

  // Pick 6 random letters for the game
  const shuffled = [...letters];
  shuffle(shuffled);
  const picked = shuffled.slice(0, 6);
  matchTotalPairs = picked.length;

  // Create tiles: 6 letter tiles + 6 name tiles
  const tiles = [];
  picked.forEach(item => {
    tiles.push({ type: "letter", value: item.letter, id: item.name });
    tiles.push({ type: "name", value: item.name, id: item.name });
  });
  shuffle(tiles);

  const grid = document.getElementById("matching-grid");
  grid.innerHTML = "";

  tiles.forEach((tile, idx) => {
    const el = document.createElement("div");
    el.className = "tile" + (tile.type === "letter" ? " is-letter" : "");
    el.textContent = tile.value;
    el.dataset.id = tile.id;
    el.dataset.type = tile.type;
    el.dataset.idx = idx;
    el.onclick = () => handleMatchClick(el);
    grid.appendChild(el);
  });
}

function handleMatchClick(el) {
  if (el.classList.contains("matched")) return;

  if (!matchSelected) {
    // First selection
    el.classList.add("selected");
    matchSelected = el;
  } else if (matchSelected === el) {
    // Deselect
    el.classList.remove("selected");
    matchSelected = null;
  } else {
    // Second selection - check match
    const firstId = matchSelected.dataset.id;
    const secondId = el.dataset.id;
    const differentTypes = matchSelected.dataset.type !== el.dataset.type;

    if (firstId === secondId && differentTypes) {
      // Match!
      matchSelected.classList.remove("selected");
      matchSelected.classList.add("matched");
      el.classList.add("matched");
      matchSelected = null;
      matchedCount++;
      updateScore(15);
      updateStreak(true);

      if (matchedCount === matchTotalPairs) {
        document.getElementById("matching-result").textContent = "All matched!";
        showCelebration(
          "Great matching!",
          "You matched all " + matchTotalPairs + " pairs!"
        );
      }
    } else {
      // No match
      el.classList.add("wrong-match");
      matchSelected.classList.add("wrong-match");
      updateStreak(false);
      const prev = matchSelected;
      matchSelected = null;
      setTimeout(() => {
        el.classList.remove("wrong-match");
        prev.classList.remove("wrong-match", "selected");
      }, 500);
    }
  }
}

// ===== CELEBRATION =====
function showCelebration(title, text) {
  const stars = [
    "\u2B50", "\u2B50\u2B50", "\u2B50\u2B50\u2B50",
    "\uD83C\uDF1F", "\uD83C\uDFC6", "\uD83C\uDF89"
  ];
  document.getElementById("celeb-star").textContent =
    stars[Math.floor(Math.random() * stars.length)];
  document.getElementById("celeb-title").textContent = title;
  document.getElementById("celeb-text").textContent = text;
  document.getElementById("celebration").classList.remove("hidden");
}

function closeCelebration() {
  document.getElementById("celebration").classList.add("hidden");
}

// ===== UTILITY =====
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Keyboard support for flashcards
document.addEventListener("keydown", (e) => {
  if (!document.getElementById("flashcards-mode").classList.contains("hidden")) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipCard(); }
    if (e.key === "ArrowRight") nextCard();
    if (e.key === "ArrowLeft") prevCard();
  }
});

// Initialize
initFlashcards();
</script>
